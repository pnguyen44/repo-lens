[project]
name = "repo-lens"
version = "0.1.0"
description = "AI-powered CLI for chatting about GitHub conversations"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.1",
    "chromadb",
    "google-genai>=2.3.0",
    "mcp>=1.27.1",
    "numpy>=2.4.6",
    "python-dotenv",
    "rich",
    "voyageai>=0.3.7",
]

[project.optional-dependencies]
dev = ["pytest", "mypy"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.pyright]
venvPath = "."
venv = ".venv"
extraPaths = ["./src"]
typeCheckingMode = "off"

[tool.mypy]
strict = true
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = "src"

# Skip type-checking inside the anthropic package to avoid a mypy internal crash on Python 3.14
[[tool.mypy.overrides]]
module = "anthropic.*"
follow_imports = "skip"

# Relax strict rules for tests — catch real type errors but don't nag about annotations
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[project]
name = "repo-lens"
version = "0.1.0"
description = "AI-powered CLI for chatting about GitHub conversations"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.104.1",
    "python-dotenv",
    "rich",
    "mypy",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.mypy]
strict = true
files = ["src"]
explicit_package_bases = true
mypy_path = "src"

# Skip type-checking inside the anthropic package to avoid a mypy internal crash on Python 3.14
[[tool.mypy.overrides]]
module = "anthropic.*"
follow_imports = "skip"
